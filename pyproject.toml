[project]
name = "nlw-newspapers-iiif-converter"
version = "0.1.0"
description = "Convert Welsh Newspapers (NLW) pages into IIIF Presentation 3 collections and manifests"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "requests",
    "iiif-prezi3",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
nlw-iiif = "nlw_iiif.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlw_iiif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
